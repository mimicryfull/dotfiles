font_family      family=MonoLisaCode


# Застосовуємо всі обрані фічі до чотирьох основних статичних стилів
font_features MonoLisaCodeUpright +calt +liga +cv01 +cv02 +cv03 +cv04 +cv05 +cv07 +cv08 +cv09 +cv10 +cv11 +dlig +ss04 +ss11 +ss13 +zero
font_features MonoLisaCodeItalic +calt +liga +cv01 +cv02 +cv03 +cv04 +cv05 +cv07 +cv08 +cv09 +cv10 +cv11 +dlig +ss04 +ss11 +ss13 +zero

font_size 13.0

# ─── Ligatures ──────────────────────────────────────
disable_ligatures cursor
# "cursor" = ligatures show while reading, break apart
# under the cursor so you can edit individual chars.
# Use "never" if you want them always on.

# ─── Smooth Cursor ──────────────────────────────────
cursor_shape           block
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 15.0
cursor_trail           150
cursor_trail_decay     0.08 0.33

shell /usr/bin/fish

# ─── Window ─────────────────────────────────────────
window_padding_width  8
window_margin_width   4
single_window_margin_width 0


# ─── Tab Bar ────────────────────────────────────────
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"

# ─── Misc ───────────────────────────────────────────
enable_audio_bell     no
visual_bell_duration  0.0
scrollback_lines      10000
mouse_hide_wait       3.0
url_style             curly
copy_on_select        yes


# ─── Katani One Dark ────────────────────────────────
foreground #abb2bf
background #17181c

# Black
color0 #3f4451
color8 #4f5666

# Red
color1 #e05561
color9 #ff616e

# Green
color2  #8cc265
color10 #a5e075

# Yellow
color3  #d18f52
color11 #f0a45d

# Blue
color4  #4aa5f0
color12 #4dc4ff

# Magenta
color5  #c162de
color13 #de73ff

# Cyan
color6  #42b3c2
color14 #4cd1e0

# White
color7  #d7dae0
color15 #e6e6e6

# Cursor
cursor            #CE93D8
cursor_text_color #17181c

# Selection
selection_foreground none
selection_background #3e4452

# URL
url_color #c678dd

# Window borders
active_border_color   #4aa5f0
inactive_border_color #1e2227
bell_border_color     #d18f52

# Tab bar
active_tab_foreground   #abb2bf
active_tab_background   #17181c
active_tab_font_style   bold
inactive_tab_foreground #5c6370
inactive_tab_background #1e2227
inactive_tab_font_style normal
tab_bar_background      #17181c
